name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check bundled MIT license
        run: cmp LICENSE app/src/main/resources/META-INF/local-gallery/LICENSE
      - name: Check Kotlin whitespace formatting
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.kt", "*.kts"]
          ).decode().split("\0")
          errors = []
          files = [name for name in paths if name]
          for name in files:
              path = pathlib.Path(name)
              data = path.read_bytes()
              if data and not data.endswith(b"\n"):
                  errors.append(f"{name}: missing final newline")
              for number, line in enumerate(data.splitlines(), start=1):
                  if line.rstrip(b" \t") != line:
                      errors.append(f"{name}:{number}: trailing whitespace")
                  if b"\t" in line:
                      errors.append(f"{name}:{number}: tab character")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Checked whitespace in {len(files)} Kotlin files.")
          PY
      - name: Build, lint, and run unit tests
        run: ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest lintDebug lintRelease testDebugUnitTest testReleaseUnitTest
